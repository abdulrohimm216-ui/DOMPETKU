<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOMPETKU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--card:#fff;--tx:#0e2a47;--mut:#6b7d92;--line:#e1e8f0;--pri:#0fb5a0;--red:#e5484d;--grn:#12a15f;--gold:#f5b83d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1522;--card:#14233a;--tx:#eaf1fa;--mut:#8fa3bb;--line:#223653;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1522;--card:#14233a;--tx:#eaf1fa;--mut:#8fa3bb;--line:#223653;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px 16px 110px;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h2,h3{margin:0}h3{font-size:16px;font-weight:800;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
h3 a{font-size:13px;color:var(--pri);font-weight:800;cursor:pointer}
.card{background:var(--card);border-radius:20px;padding:14px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:12.5px}
.top{display:flex;align-items:center;gap:10px}.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#ff8a5b);display:grid;place-items:center;font-size:22px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:17px}
.total{margin-top:14px;border-radius:26px;padding:20px;color:#fff;background:linear-gradient(140deg,#0e2a47,#0b6f78 70%,#0fb5a0);position:relative;overflow:hidden;animation:pop .5s}
.total:after,.total:before{content:"";position:absolute;border-radius:50%;border:18px solid rgba(245,184,61,.22);width:150px;height:150px;right:-40px;top:-50px}
.total:before{width:90px;height:90px;right:60px;top:auto;bottom:-50px;border-color:rgba(255,255,255,.1)}
.big{font-size:36px;font-weight:900;letter-spacing:-1px;margin:2px 0 10px}
.bar{height:8px;border-radius:9px;background:rgba(127,140,160,.22);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{padding:14px;border-radius:16px;font-weight:800;text-align:center;background:var(--card);border:1px solid var(--line)}
.btn.in{background:var(--pri);color:#fff;border:0}.btn.out{background:#ff6b5e;color:#fff;border:0}.btn.dk{background:var(--tx);color:var(--bg);border:0}.btn.sm{padding:9px;font-size:13px;border-radius:12px}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.wal{flex:0 0 74%;scroll-snap-align:start;border-radius:22px;padding:16px 16px 14px;color:#fff;position:relative;overflow:hidden;text-align:left;min-height:158px}
.wal:before{content:"";position:absolute;left:0;right:0;top:0;height:46px;background:rgba(255,255,255,.14);border-radius:0 0 50% 50%/0 0 100% 100%}
.wal:after{content:"";position:absolute;right:-8px;top:52px;width:34px;height:40px;border-radius:12px 0 0 12px;background:rgba(0,0,0,.18)}
.wal .em{font-size:40px;line-height:1;position:relative;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.wal b{display:block;font-size:12.5px;opacity:.9;margin-top:6px;letter-spacing:.2px}.wal .am{font-size:21px;font-weight:900}
.wal .bar{background:rgba(255,255,255,.28);margin-top:8px}.wal .bar i{background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .wal{flex:none;min-height:150px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}.tx:last-child{border:0}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.tx>div:nth-child(2){flex:1;min-width:0}.tx b{display:block;font-size:14.5px}.pos{color:var(--grn);font-weight:800}.neg{color:var(--red);font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px 0}.chip{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px;white-space:nowrap}.chip.on{background:var(--tx);color:var(--bg)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:5;max-width:480px;margin:auto}
.nav button{flex:1;font-size:11px;font-weight:800;color:var(--mut);display:flex;flex-direction:column;gap:2px;align-items:center}.nav button span{font-size:21px}.nav button.on{color:var(--pri)}
.fab{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 224px));width:56px;height:56px;border-radius:50%;background:var(--gold);color:#3a2a00;font-size:32px;font-weight:900;box-shadow:0 8px 20px rgba(245,184,61,.5);z-index:6}
.ov{position:fixed;inset:0;background:rgba(5,12,24,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;margin:4px 0 8px}
label{font-size:12.5px;font-weight:800;color:var(--mut)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.kp button{padding:13px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:800}
.amtd{font-size:36px;font-weight:900;text-align:center;margin:6px 0}
.cat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 10px}.cat button{padding:7px 0;border-radius:14px;border:2px solid transparent;background:var(--card);font-size:22px;display:flex;flex-direction:column;gap:2px;align-items:center}.cat button small{font-size:9.5px;font-weight:800;color:var(--mut)}.cat button.on{border-color:var(--pri)}
.hero{border-radius:26px;padding:18px;color:#fff;text-align:center;position:relative;overflow:hidden;animation:pop .4s}
.hero .em{font-size:54px}.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:800;z-index:40;animation:pop .3s;max-width:90%;text-align:center;font-size:14px}
.coin{position:fixed;font-size:30px;z-index:50;animation:fly .9s forwards;pointer-events:none}
.tip{background:rgba(15,181,160,.12);border-radius:14px;padding:11px 13px;font-size:13px;margin:8px 0}.tip.w{background:rgba(229,72,77,.12)}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}.empty div{font-size:42px}
@keyframes pop{from{transform:scale(.96);opacity:.4}}@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fly{to{transform:translateY(-120px) rotate(40deg);opacity:0}}
.rise{animation:rise .55s cubic-bezier(.2,.9,.3,1.15) backwards}@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.95)}}
.em{display:inline-block;animation:bob 3.2s ease-in-out infinite}.wal:nth-child(even) .em{animation-delay:-1.6s}@keyframes bob{50%{transform:translateY(-6px) rotate(-5deg)}}
.wal,.btn,.chip,.kp button,.fab,.ib{transition:transform .18s}.wal:active{transform:scale(.95) rotate(-1deg)}.btn:active,.chip:active,.ib:active{transform:scale(.93)}.kp button:active{transform:scale(.88);background:var(--pri);color:#fff}
.total:after{animation:spin 20s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.fc{position:absolute;bottom:-12px;font-size:18px;opacity:0;animation:fl 4s ease-in infinite}@keyframes fl{20%{opacity:.9}to{transform:translateY(-140px) rotate(45deg);opacity:0}}
.fab{animation:ring 2.4s infinite}.fab:active{transform:rotate(90deg) scale(.88)}@keyframes ring{0%{box-shadow:0 8px 20px rgba(245,184,61,.5),0 0 0 0 rgba(245,184,61,.55)}70%,100%{box-shadow:0 8px 20px rgba(245,184,61,.5),0 0 0 18px rgba(245,184,61,0)}}
.nav button.on span{animation:bnc .5s}@keyframes bnc{40%{transform:translateY(-8px) scale(1.25)}}
.ov{animation:fade .2s}@keyframes fade{from{opacity:0}}.bmp{animation:bmp .22s}@keyframes bmp{50%{transform:scale(1.12)}}
.jf{animation:jf 1.2s cubic-bezier(.2,.8,.2,1)}@keyframes jf{from{transform:translateY(100px)}}
.ib sup{animation:blk 1.2s infinite}@keyframes blk{50%{opacity:.2}}
.coin{animation-duration:1.1s}@keyframes drop{0%{transform:translateY(-20px) scale(.6);opacity:0}25%{opacity:1}to{transform:translateY(260px) rotate(360deg);opacity:0}}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:60;animation:cfa 2.2s ease-in forwards}@keyframes cfa{to{transform:translate(var(--x),105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="ovl"></div>
<script>
const K='dompetku_v1',now=new Date(),pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const T=iso(now),YM=T.slice(0,7),DIM=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),DAY=now.getDate();
const ago=n=>{const d=new Date(now);d.setDate(d.getDate()-n);return iso(d)};
const mAgo=n=>iso(new Date(now.getFullYear(),now.getMonth()-n,1)).slice(0,7);
const sum=a=>a.reduce((x,y)=>x+y,0),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAL=['#f59e0b','#3b82f6','#8b5cf6','#ec4899','#10b981','#f97316','#06b6d4','#64748b','#ef4444','#84cc16'];
function seed(){const W=[['makan','Makan','🍜',1e6],['jalan','Jalan-Jalan','🧳',3e5],['butuh','Kebutuhan','🛍️',5e5],['tabung','Tabungan','🐷',1e6,1],['invest','Investasi','📈',5e5],['ortu','Orang Tua','👨‍👩‍👧',5e5],['bebas','Uang Bebas','👛',5e5],['darurat','Dana Darurat','🛡️',5e5,1],['tagih','Tagihan','🧾',2e5]];
let id=0;const t=(type,amt,name,w,pay,date)=>({id:'s'+id++,type,amt,name,w,pay,date,sample:1});
return{name:'Kamu',hide:0,wallets:W.map((w,i)=>({id:w[0],name:w[1],emoji:w[2],color:PAL[i],budget:w[3],locked:!!w[4]})),
tx:[t('in',5e6,'Gaji bulanan','','Transfer',YM+'-01'),t('out',25000,'Makan siang','makan','GoPay',ago(0)),t('out',15000,'Transportasi','butuh','Tunai',ago(0)),t('out',48000,'Makan malam','makan','DANA',ago(1)),t('out',150000,'Belanja bulanan','butuh','Debit',ago(2)),t('out',32000,'Kopi','bebas','GoPay',ago(2)),t('out',127000,'Makan bersama','makan','OVO',ago(3)),
t('in',5e6,'Gaji bulanan','','Transfer',mAgo(1)+'-01'),t('out',950000,'Makan sebulan','makan','Tunai',mAgo(1)+'-12'),t('out',420000,'Kebutuhan','butuh','Debit',mAgo(1)+'-14'),t('out',350000,'Liburan singkat','jalan','Debit',mAgo(1)+'-20'),
t('in',4.8e6,'Gaji bulanan','','Transfer',mAgo(2)+'-01'),t('out',900000,'Makan sebulan','makan','Tunai',mAgo(2)+'-12'),t('out',500000,'Kebutuhan','butuh','Debit',mAgo(2)+'-15'),
t('in',4.8e6,'Gaji bulanan','','Transfer',mAgo(3)+'-01'),t('out',1.1e6,'Makan sebulan','makan','Tunai',mAgo(3)+'-12')],
goals:[{id:'g1',name:'Beli HP',emoji:'📱',target:5e6,saved:2e6,month:'',monthly:500000,sample:1},{id:'g2',name:'Liburan',emoji:'🏝️',target:3e6,saved:450000,month:'',monthly:0,sample:1}],
bills:[{id:'b1',name:'Listrik',emoji:'💡',amt:350000,day:28,paid:'',sample:1},{id:'b2',name:'Internet',emoji:'📶',amt:300000,day:20,paid:'',sample:1},{id:'b3',name:'Netflix',emoji:'🎬',amt:54000,day:Math.min(DAY+3,DIM),paid:'',sample:1},{id:'b4',name:'Uang Orang Tua',emoji:'👨‍👩‍👧',amt:500000,day:5,paid:YM,sample:1}],
sal:{amount:5e6,mode:'nom',al:{makan:1e6,tabung:1e6,ortu:5e5,invest:5e5,jalan:3e5,butuh:5e5,bebas:5e5,darurat:5e5,tagih:2e5}},acc:{}}}
const DEFAPPS=[{n:'Tunai',c:'#64748b'},{n:'Kartu Debit',c:'#475569'},{n:'BCA',c:'#0b5fb3',u:'bcamobile://'},{n:'BRI',c:'#0a6bd1',u:'brimo://'},{n:'Mandiri',c:'#0e3a7a',u:'livin://'},{n:'BNI',c:'#e8590c',u:'bnimobile://'},{n:'GoPay',c:'#00aa13',u:'gojek://'},{n:'DANA',c:'#118eea',u:'dana://'},{n:'OVO',c:'#4c2a86',u:'ovo://'},{n:'ShopeePay',c:'#ee4d2d',u:'shopeeid://'},{n:'LinkAja',c:'#e11d2a',u:'linkaja://'}];
let APPS=DEFAPPS,S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();fix();if(!S.inv)S.inv=[{id:'i1',name:'Reksa Dana Pasar Uang',emoji:'📘',modal:1e6,nilai:1032000,sample:1,h:[{t:'Beli',amt:1e6,date:mAgo(2)+'-10'},{t:'Nilai',amt:1032000,date:ago(2)}]}];
function fix(){const D={makan:'GoPay',jalan:'DANA',butuh:'BCA',tabung:'BRI',invest:'Mandiri',ortu:'BCA',bebas:'OVO',darurat:'BRI',tagih:'BCA'};if(!S.links)S.links={};if(!S.apps)S.apps=JSON.parse(JSON.stringify(DEFAPPS));APPS=S.apps;Object.keys(S.links).forEach(n=>{const a=APPS.find(x=>x.n==n);if(a)a.u=S.links[n]});S.links={};if(!S.inv)S.inv=[];if(!S.bal)S.bal={};S.wallets.forEach(w=>{if(w.acc===undefined)w.acc=D[w.id]||''})}
function openApp(n){const a=APPS.find(x=>x.n==n),u=a&&a.u;if(!u)return;let h=0;const f=()=>{if(document.hidden)h=1};document.addEventListener('visibilitychange',f);setTimeout(()=>{document.removeEventListener('visibilitychange',f);if(!h)toast('Aplikasi '+n+' tidak terbuka. Buka manual, atau atur tautannya di Profil.')},2200);try{location.href=u}catch(e){}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const m$=n=>S.hide?'Rp•••••':rp(n);
const W=id=>S.wallets.find(w=>w.id===id),mTx=ym=>S.tx.filter(t=>t.date.startsWith(ym||YM));
const tot=(l,ty)=>sum(l.filter(t=>t.type===ty).map(t=>t.amt));
function ws(w){const m=mTx().filter(t=>t.w===w.id),o=tot(m,'out'),i=tot(m,'in'),cap=w.budget+i;return{out:o,cap,rem:cap-o,pct:cap>0?Math.min(100,Math.round(o/cap*100)):(o>0?100:0)}}
const totalMoney=()=>tot(S.tx,'in')-tot(S.tx,'out');
/* ---- DOMPET UTAMA: saldo asli per bank / e-wallet, otomatis ikut transaksi dompet anggaran ---- */
const stat=(l,v,r,c)=>`<div style="margin-top:9px"><div class="row sp"><span>${l}</span><b>${m$(v)}</b></div><div class="bar" style="margin-top:4px"><i style="width:${Math.max(2,Math.min(100,(r||0)*100))}%;background:${r>1?'#e5484d':c}"></i></div></div>`;
const accNet=n=>sum(S.tx.filter(t=>t.pay===n).map(t=>t.type=='in'?t.amt:-t.amt));
const accBal=n=>S.bal[n]===undefined?null:S.bal[n]+accNet(n);
function accSet(i){const a=APPS[i],c=accBal(a.n);modal('Saldo '+esc(a.n),[{k:'v',l:'Saldo '+esc(a.n)+' saat ini (Rp)',t:'number',v:c===null?'':c}],v=>{if(v.v===''||isNaN(+v.v))return toast('Isi saldo dulu'),false;S.bal[a.n]=+v.v-accNet(a.n);save();toast('Saldo '+a.n+' diperbarui');render()},'Simpan')}
function accMenu(i){const a=APPS[i],b=accBal(a.n),lw=S.wallets.filter(w=>w.acc==a.n);$o.innerHTML=`<div class="ov" onclick="if(event.target==this)closeO()"><div class="sheet"><div style="position:relative;aspect-ratio:160/120;max-width:220px;margin:0 auto;color:#fff">${walletSvg(a.c,'m')}<div style="position:absolute;left:9%;top:44%;width:56%"><b>${esc(a.n)}</b><div style="font-weight:900;font-size:15px">${b===null?'Saldo belum diatur':m$(b)}</div></div></div><p class="mut" style="text-align:center">${lw.length?'Dompet tersambung: '+lw.map(w=>w.emoji+' '+esc(w.name)).join(', '):'Belum ada dompet anggaran yang tersambung. Atur di Ubah Dompet.'}</p><div class="acts" style="grid-template-columns:1fr"><button class="btn in" onclick="closeO();accSet(${i})">💰 Atur Saldo</button><button class="btn" onclick="closeO();appForm(${i})">✏️ Edit</button><button class="btn out" onclick="closeO();appDel(${i})">🗑️ Hapus</button><button class="btn" onclick="closeO()">Tutup</button></div></div></div>`}
function walletSvg(c,id){return`<svg viewBox="0 0 160 120" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient></defs><g transform="rotate(-7 60 30)"><rect x="18" y="4" width="84" height="46" rx="7" fill="#fff" opacity=".9"/><rect x="26" y="14" width="26" height="6" rx="3" fill="${c}" opacity=".55"/></g><g transform="rotate(5 110 30)"><rect x="66" y="8" width="70" height="42" rx="7" fill="#ffd36b"/><circle cx="82" cy="24" r="6" fill="#fff" opacity=".6"/></g><rect x="3" y="26" width="154" height="90" rx="17" fill="${c}"/><rect x="3" y="26" width="154" height="90" rx="17" fill="url(#g${id})"/><rect x="10" y="33" width="140" height="76" rx="12" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M108 56h46a0 0 0 0 1 0 0v36h-46a18 18 0 0 1 0-36z" fill="#000" fill-opacity=".22"/><circle cx="125" cy="74" r="7" fill="#ffd36b"/><circle cx="125" cy="74" r="2.6" fill="${c}"/></svg>`}
function accSec(home){const l=APPS.map((a,i)=>({a,i,ws:S.wallets.filter(w=>w.acc==a.n)})).filter(x=>x.ws.length||x.a.m||S.bal[x.a.n]!==undefined);

/* bills, assistant, profile */
function pBills(){return`<div class="row"><button class="ib" onclick="back()">←</button><h2>Tagihan</h2></div><div style="margin-top:12px">${S.bills.sort((a,b)=>bill(a)[2]-bill(b)[2]).map(b=>billCard(b)).join('')||EMPTY('🧾','Belum ada tagihan','Tambahkan listrik, internet, atau cicilan.')}</div><button class="btn dk" style="width:100%" onclick="modal('Tagihan Baru',[{k:'n',l:'Nama tagihan'},{k:'e',l:'Ikon (emoji)',v:'🧾'},{k:'a',l:'Nominal (Rp)',t:'number'},{k:'d',l:'Jatuh tempo (tanggal 1-28)',t:'number',v:25}],v=>{if(!v.n.trim())return toast('Isi nama'),false;S.bills.push({id:'b'+Date.now(),name:v.n.trim(),emoji:v.e||'🧾',amt:+v.a||0,day:Math.min(28,Math.max(1,+v.d||1)),paid:''});save();render()})">＋ Tagihan Baru</button><p class="mut">Tombol bayar hanya mengubah status catatan. Tidak ada pembayaran sungguhan.</p>`}
function pAssist(){const Q=[['Berapa uang yang aman saya gunakan?',()=>{const x=S.wallets.filter(w=>!w.locked&&!['tagih','invest','ortu'].includes(w.id)),r=sum(x.map(w=>Math.max(0,ws(w).rem)));return['🛟',rp(r),`Sisa anggaran dompet harian (tanpa tabungan, tagihan, investasi). Sekitar ${rp(r/(DIM-DAY+1))} per hari.`]}],['Berapa total pengeluaran bulan ini?',()=>['💸',rp(tot(mTx(),'out')),`${mTx().filter(t=>t.type=='out').length} transaksi.`]],['Dompet mana yang hampir habis?',()=>{const l=S.wallets.filter(w=>ws(w).pct>=80&&ws(w).cap>0);return['⚠️',l.length+' dompet',l.length?l.map(w=>`${w.name} (${ws(w).pct}%)`).join(', '):'Belum ada. Semua anggaran masih aman.']}],['Berapa uang yang sudah saya tabung?',()=>['🐷',rp(sum(S.goals.map(g=>g.saved))),`Total di ${S.goals.length} target tabungan (dicatat virtual).`]],['Berapa yang bisa dialokasikan untuk investasi?',()=>{const m=totalMoney()-sum(S.bills.filter(b=>b.paid!==YM).map(b=>b.amt));return['📈',rp(Math.max(0,m)),'Total uang dikurangi tagihan belum dibayar. Sisakan juga dana darurat sebelum berinvestasi.']}],['Apa pengeluaran terbesar saya?',()=>{const o=mTx().filter(t=>t.type=='out').sort((a,b)=>b.amt-a.amt)[0];return o?['🏆',rp(o.amt),`${o.name} pada ${fdate(o.date)}.`]:['🏆','-','Belum ada pengeluaran bulan ini.']}],['Berapa sisa uang setelah tagihan?',()=>{const u=sum(S.bills.filter(b=>b.paid!==YM).map(b=>b.amt));return['🧾',rp(totalMoney()-u),`Total uang dikurangi tagihan belum dibayar ${rp(u)}.`]}],['Apakah anggaran jalan-jalan masih ada?',()=>{const w=W('jalan');if(!w)return['🧳','-','Dompet Jalan-Jalan tidak ditemukan.'];const s=ws(w);return['🧳',rp(s.rem),s.rem>0?`Masih ada ${100-s.pct}% anggaran.`:'Anggaran sudah habis.']}]];
window.QA=Q;return`<div class="row"><button class="ib" onclick="back()">←</button><h2>Asisten Keuangan</h2></div><p class="mut">Jawaban dihitung dari datamu di aplikasi.</p>${Q.map((q,i)=>`<button class="chip" style="display:block;width:100%;text-align:left;margin:6px 0" onclick="ans(${i})">${q[0]}</button>`).join('')}<div id="ans"></div>`}
function ans(i){const a=QA[i][1]();document.getElementById('ans').innerHTML=`<div class="card" style="text-align:center;margin-top:12px;animation:pop .3s"><div style="font-size:40px">${a[0]}</div><div class="big" style="margin:0">${S.hide?'Rp•••••':a[1]}</div><div class="mut">${a[2]}</div></div>`}
function pProfile(){const A=['BCA','BRI','Mandiri','GoPay','DANA','OVO','ShopeePay'],c=['#0b5fb3','#0a6bd1','#0e3a7a','#00aa13','#118eea','#4c2a86','#ee4d2d'];
return`<h2>Profil</h2><div class="card row"><div class="av">🦊</div><div style="flex:1"><b>${esc(S.name)}</b><div class="mut">Ketuk untuk ganti nama</div></div><button class="btn sm" onclick="modal('Nama',[{k:'n',l:'Nama panggilan',v:S.name}],v=>{S.name=v.n.trim()||'Kamu';save();render()})">Ubah</button></div>
<h3>Aplikasi Pembayaran <a onclick="appForm(-1)">＋ Tambah</a></h3><div class="tip">DOMPETKU tidak terhubung ke bank atau e-wallet. Saldo di tiap aplikasi (tombol 💰) kamu isi sendiri, lalu ikut naik-turun otomatis mengikuti transaksi yang kamu catat. Daftar ini milikmu sendiri: tambah, ubah, atau hapus aplikasi sesukamu. Isi tautan pembuka agar aplikasi terbuka otomatis setelah mencatat. Tautan bawaan belum saya uji dan bisa berbeda di tiap HP.</div>
${APPS.map((a,i)=>`<div class="card row" style="margin-bottom:8px"><div class="ic" style="background:${a.c};color:#fff;font-size:11px;font-weight:900;width:52px">${esc(a.n.slice(0,5))}</div><div style="flex:1;min-width:0"><b>${esc(a.n)}</b><div class="mut">${S.wallets.filter(w=>w.acc==a.n).length} dompet · ${a.u?'ada tautan':'tanpa tautan'}${accBal(a.n)!==null?' · Saldo '+m$(accBal(a.n)):''}</div></div><button class="btn sm" onclick="accSet(${i})">💰</button>${a.u?`<button class="btn sm" onclick="openApp(APPS[${i}].n)">Buka</button>`:''}<button class="btn sm" onclick="appForm(${i})">✏️</button><button class="btn sm" onclick="appDel(${i})">🗑️</button></div>`).join('')||EMPTY('💳','Belum ada aplikasi','Tambahkan bank atau e-wallet yang kamu pakai.')}
<h3>Pengaturan</h3><div class="acts"><button class="btn" onclick="go('assist')">🤖 Asisten</button><button class="btn" onclick="go('bills')">🧾 Tagihan</button><button class="btn" onclick="ask('Hapus semua data contoh? Data yang kamu buat sendiri tetap ada.',()=>{const keep={};Object.keys(S.bal).forEach(n=>keep[n]=accBal(n));S.tx=S.tx.filter(t=>!t.sample);Object.keys(keep).forEach(n=>S.bal[n]=keep[n]-accNet(n));S.goals=S.goals.filter(g=>!g.sample);S.bills=S.bills.filter(b=>!b.sample);save();toast('Data contoh dihapus');render()})">🧹 Hapus Data Contoh</button><button class="btn" onclick="ask('Reset SEMUA data ke awal? Tindakan ini tidak bisa dibatalkan.',()=>{S=seed();fix();save();setTab('home')})">♻️ Reset Semua</button></div>
<p class="mut" style="margin-top:14px">Data tersimpan di perangkat ini saja. Data bertanda "contoh" hanya untuk demonstrasi.</p>`}
function render(){const c=stk.length?stk[stk.length-1]:{p:tab},P={home:pHome,wallets:pWallets,report:pReport,goals:pGoals,profile:pProfile,detail:()=>pDetail(c.a),hist:pHist,salary:pSalary,bills:pBills,assist:pAssist,inv:pInv};
document.getElementById('app').innerHTML=P[c.p]()+`<div class="nav">${[['home','🏠','Beranda'],['wallets','👛','Dompet'],['report','📊','Laporan'],['goals','🎯','Target'],['profile','👤','Profil']].filter(x=>x[0]||1).map(x=>x[0]?`<button class="${!stk.length&&tab==x[0]?'on':''}" onclick="setTab('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`:'<div style="width:50px"></div>').join('')}</div><button class="fab" aria-label="Tambah transaksi" onclick="openSheet('out')">+</button>`;anim()}
function pInv(){const a=S.inv,m=sum(a.map(x=>x.modal)),n=sum(a.map(x=>x.nilai)),gl=n-m,w=W('invest'),r=w?Math.max(0,ws(w).rem):0,pc=(g,b)=>(b?(g/b*100):0).toFixed(1)+'%';
return`<div class="row"><button class="ib" onclick="back()">←</button><h2>Investasi</h2></div>
<div class="total" style="background:linear-gradient(140deg,#0e2a47,#5b3fb5)"><div style="font-size:12px;font-weight:800;opacity:.85;letter-spacing:.6px">NILAI ASET SAAT INI</div><div class="big" data-cu="${n}">${m$(n)}</div><div class="row sp" style="font-size:13px"><span>Total modal<br><b>${m$(m)}</b></span><span style="text-align:right">${gl>=0?'Untung':'Rugi'}<br><b>${gl>=0?'+':'−'}${m$(Math.abs(gl))} (${pc(gl,m)})</b></span></div></div>
<div class="tip">💼 Dana siap diinvestasikan di Dompet Investasi: <b>${m$(r)}</b>. Uang ini baru menjadi aset setelah kamu mencatat pembelian.</div>
<div class="tip">Nilai aset kamu isi manual. Aplikasi tidak mengambil harga pasar.</div>
${a.map(x=>{const g2=x.nilai-x.modal;return`<div class="card" style="margin-bottom:10px"><div class="row"><div class="ic" style="background:rgba(91,63,181,.18)">${x.emoji}</div><div style="flex:1"><b>${esc(x.name)}${x.sample?' <span class="pill" style="background:rgba(245,184,61,.25);font-size:9.5px">contoh</span>':''}</b><div class="mut">Modal ${m$(x.modal)}</div><div class="bar" style="margin-top:5px"><i style="width:${Math.min(100,x.nilai/Math.max(x.modal,x.nilai,1)*100)}%;background:${g2>=0?'#12a15f':'#e5484d'}"></i></div></div><div style="text-align:right"><b>${m$(x.nilai)}</b><div class="${g2>=0?'pos':'neg'}">${g2>=0?'+':'−'}${pc(Math.abs(g2),x.modal)}</div></div></div>
<div class="row" style="margin-top:10px"><button class="btn sm in" onclick="invAct('${x.id}','b')">Beli</button><button class="btn sm out" onclick="invAct('${x.id}','s')">Jual</button><button class="btn sm" onclick="invAct('${x.id}','v')">Nilai</button><button class="btn sm" onclick="ask('Hapus aset ${esc(x.name)} dari catatan?',()=>{S.inv=S.inv.filter(i=>i.id!='${x.id}');save();render()})">🗑️</button></div>
<div class="mut" style="margin-top:8px">${x.h.slice(-3).reverse().map(h=>`${h.t} ${rp(h.amt)} · ${fdate(h.date)}`).join('<br>')}</div></div>`}).join('')||EMPTY('📈','Belum ada aset','Catat reksa dana, saham, emas, atau aset lain secara manual.')}
<button class="btn dk" style="width:100%" onclick="invNew()">＋ Aset Baru</button>`}
function invNew(){modal('Aset Baru',[{k:'n',l:'Nama aset (mis. Emas, Saham BBCA)'},{k:'e',l:'Ikon (emoji)',v:'📈'},{k:'m',l:'Modal awal (Rp)',t:'number'},{k:'v',l:'Nilai saat ini (Rp, kosong = sama dengan modal)',t:'number'}],v=>{const m=+v.m;if(!v.n.trim()||!(m>0))return toast('Isi nama dan modal'),false;S.inv.push({id:'i'+Date.now(),name:v.n.trim(),emoji:v.e||'📈',modal:m,nilai:+v.v>0?+v.v:m,h:[{t:'Beli',amt:m,date:T}]});save();toast('Aset dicatat 📈');render()})}
function invAct(id,k){const x=S.inv.find(i=>i.id==id),yn=[['1','Ya'],['0','Tidak']];
if(k=='v')return modal('Perbarui Nilai',[{k:'a',l:'Nilai saat ini (Rp)',t:'number',v:x.nilai}],v=>{if(!(+v.a>=0)||v.a==='')return toast('Isi nilai'),false;x.nilai=+v.a;x.h.push({t:'Nilai',amt:x.nilai,date:T});save();render()});
if(k=='b')return modal('Beli '+x.name,[{k:'a',l:'Nominal pembelian (Rp)',t:'number'},{k:'w',l:'Catat sebagai pengeluaran Dompet Investasi?',o:yn,v:'1'}],v=>{const a=+v.a;if(!(a>0))return toast('Isi nominal'),false;x.modal+=a;x.nilai+=a;x.h.push({t:'Beli',amt:a,date:T});if(v.w=='1')S.tx.push({id:'t'+Date.now(),type:'out',amt:a,name:'Beli '+x.name,w:'invest',pay:(W('invest')||{}).acc||'Transfer',date:T});save();coin();toast('Pembelian dicatat');render()});
modal('Jual '+x.name,[{k:'s',l:'Nilai aset yang dijual (Rp)',t:'number'},{k:'a',l:'Uang yang diterima (Rp)',t:'number'},{k:'w',l:'Catat sebagai pemasukan Dompet Investasi?',o:yn,v:'1'}],v=>{const sd=+v.s,a=+v.a;if(!(sd>0)||!(a>=0)||v.a==='')return toast('Isi kedua nominal'),false;if(sd>x.nilai)return toast('Melebihi nilai aset'),false;x.modal-=x.modal*sd/x.nilai;x.nilai-=sd;x.h.push({t:'Jual',amt:a,date:T});if(v.w=='1'&&a>0)S.tx.push({id:'t'+Date.now(),type:'in',amt:a,name:'Jual '+x.name,w:'invest',pay:(W('invest')||{}).acc||'Transfer',date:T});save();coin('in');toast('Penjualan dicatat');render()})}
function appForm(i){const a=i>=0?APPS[i]:null;modal(a?'Edit Dompet Utama':'Dompet Utama Baru',[{k:'n',l:'Nama bank / e-wallet (mis. SeaBank, Jago, Bibit)',v:a?a.n:''},{k:'u',l:'Tautan pembuka aplikasi (opsional, mis. dana://)',v:a?a.u||'':''},{k:'s',l:'Saldo saat ini (Rp, opsional)',t:'number',v:a&&accBal(a.n)!==null?accBal(a.n):''},{k:'c',l:'Warna',t:'color',v:a?a.c:'#0fb5a0'}],v=>{const n=v.n.trim(),u=v.u.trim();if(!n)return toast('Isi nama aplikasi'),false;if(APPS.some((x,j)=>j!=i&&x.n.toLowerCase()==n.toLowerCase()))return toast('Nama sudah dipakai'),false;if(a){if(a.n!=n){S.wallets.forEach(w=>{if(w.acc==a.n)w.acc=n});S.tx.forEach(t=>{if(t.pay==a.n)t.pay=n});if(S.bal[a.n]!==undefined){S.bal[n]=S.bal[a.n];delete S.bal[a.n]}if(S.sal&&S.sal.acc==a.n)S.sal.acc=n}a.n=n;a.c=v.c;if(u)a.u=u;else delete a.u}else APPS.push(u?{n,c:v.c,u,m:1}:{n,c:v.c,m:1});if(v.s!==''&&!isNaN(+v.s))S.bal[n]=+v.s-accNet(n);save();toast('Dompet utama tersimpan');render()})}
function appDel(i){const a=APPS[i],c=S.wallets.filter(w=>w.acc==a.n).length;ask(`Hapus ${esc(a.n)}?${c?` ${c} dompet akan kehilangan label sumber saldonya.`:''} Riwayat transaksi tidak berubah.`,()=>{S.wallets.forEach(w=>{if(w.acc==a.n)w.acc=''});delete S.bal[a.n];if(S.sal&&S.sal.acc==a.n)S.sal.acc='';APPS.splice(i,1);save();render()})}
function confetti(){const C=['#f5b83d','#0fb5a0','#ff6b5e','#3b82f6','#ec4899'];for(let i=0;i<40;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}%;background:${C[i%5]};animation-delay:${Math.random()*.5}s;--x:${(Math.random()-.5)*180}px`;document.body.append(e);setTimeout(()=>e.remove(),2800)}toast('🎉 Target tercapai!')}
function anim(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const A=document.getElementById('app');
A.querySelectorAll('.car>.wal,.grid>.wal,.tx,.card,.acts>.btn,.tip').forEach((e,i)=>{e.classList.add('rise');e.style.animationDelay=Math.min(i,16)*40+'ms'});
A.querySelectorAll('.bar i').forEach(e=>{const w=e.style.width;e.style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>e.style.width=w))});
A.querySelectorAll('circle[stroke-dasharray]').forEach(e=>{const d=e.getAttribute('stroke-dasharray');e.style.strokeDasharray='0 400';setTimeout(()=>e.style.strokeDasharray=d,40)});
if(!S.hide)A.querySelectorAll('[data-cu]').forEach(e=>{const v=+e.dataset.cu,n=e.firstChild,t0=performance.now();if(!n||n.nodeType!=3)return;(function f(t){const p=Math.min(1,(t-t0)/900),k=1-Math.pow(1-p,3);n.nodeValue=rp(v*k);if(p<1)requestAnimationFrame(f)})(t0)});
const tc=A.querySelector('.total');if(tc)tc.insertAdjacentHTML('beforeend','<span class="fc" style="left:62%">🪙</span><span class="fc" style="left:78%;animation-delay:1.3s">💵</span><span class="fc" style="left:90%;animation-delay:2.4s">🪙</span>')}
render();
</script></body></html>
